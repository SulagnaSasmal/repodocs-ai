services:
  redis:
    image: redis:7-alpine
    container_name: repodocs-ai-redis
    restart: unless-stopped
    # Not published to the host: only the control plane, on the compose
    # network, can reach Redis, and it needs the password.
    volumes:
      - repodocs-ai-redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD, for example with openssl rand -hex 24}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  control-plane:
    build:
      context: ../..
      dockerfile: experimental/deploy/Dockerfile
    container_name: repodocs-ai-control-plane
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REPODOCS_CONTROL_PLANE_HOST: 0.0.0.0
      REPODOCS_CONTROL_PLANE_PORT: 4312
      REPODOCS_CONTROL_PLANE_DATA_DIR: /var/data/control-plane
      REPODOCS_CONTROL_PLANE_BOOTSTRAP_USER: admin
      REPODOCS_CONTROL_PLANE_BOOTSTRAP_DISPLAY_NAME: RepoDocs Admin
      REPODOCS_CONTROL_PLANE_BOOTSTRAP_KEY: ${REPODOCS_CONTROL_PLANE_BOOTSTRAP_KEY:?Set REPODOCS_CONTROL_PLANE_BOOTSTRAP_KEY to 24+ random characters, for example with openssl rand -hex 24}
    ports:
      - "127.0.0.1:4312:4312"
    volumes:
      - repodocs-ai-control-plane-data:/var/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4312/health').then((response)=>{if(!response.ok){process.exit(1);}return response.json();}).then((payload)=>{if(payload.status!=='ok'){process.exit(1);}}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  repodocs-ai-redis-data:
  repodocs-ai-control-plane-data: