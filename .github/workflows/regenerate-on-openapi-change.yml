name: Regenerate OpenAPI Docs On Spec Change

on:
  push:
    branches:
      - main
    paths:
      - examples/openapi/**
      - scripts/generate-openapi-docs.mjs
      - scripts/generate-all-openapi-docs.mjs
      - scripts/validate-openapi-examples.mjs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate docs for all OpenAPI specs
        run: npm run generate:openapi:all

      - name: Validate regenerated output
        run: npm run validate

      - name: Upload regenerated docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-openapi-docs
          path: generated