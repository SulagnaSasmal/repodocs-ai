name: Generate OpenAPI Docs

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Relative path to the OpenAPI file to convert
        required: true
        default: examples/openapi/payments-openapi.yaml
      output_directory:
        description: Relative output directory for generated docs
        required: true
        default: generated/payments-platform-api

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs from OpenAPI
        # Inputs pass through the environment, never into the script text, so a
        # crafted value cannot run shell commands.
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        run: node scripts/generate-openapi-docs.mjs "$SPEC_PATH" "$OUTPUT_DIRECTORY"

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: generated-openapi-docs
          path: ${{ inputs.output_directory }}