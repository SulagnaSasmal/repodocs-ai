name: Build Automation Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - agents/**
      - analytics/**
      - knowledge-graph/**
      - scripts/run-documentation-agent.mjs
      - scripts/generate-analytics-report.mjs
      - scripts/build-knowledge-graph.mjs
      - scripts/generate-openapi-docs.mjs
      - scripts/lib/docs-automation-utils.mjs
      - examples/openapi/**
      - examples/**
      - docs/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run documentation agent
        run: npm run agent:run

      - name: Generate analytics report
        run: npm run analytics:report

      - name: Build knowledge graph
        run: npm run graph:build

      - name: Upload automation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repodocs-ai-automation-assets
          path: |
            agents/output
            analytics/output
            knowledge-graph/output